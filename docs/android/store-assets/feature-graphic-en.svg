<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">DoneAt — Know when your time is yours</title>
  <desc id="desc">The DoneAt open clock sits beside the app name and its time-focused tagline on a plum background.</desc>
  <defs>
    <linearGradient id="evening" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B2048"/>
      <stop offset="1" stop-color="#1D1329"/>
    </linearGradient>
    <linearGradient id="ring" x1="300" y1="130" x2="470" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A45"/>
      <stop offset="1" stop-color="#F05218"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#evening)"/>
  <!-- Exact open-clock geometry from assets/brand/off-work-countdown-icon.svg, scaled as a mark. -->
  <g transform="translate(245 92) scale(.31)">
    <path d="M415 793.8 A 298 298 0 1 1 804.5 568.9" fill="none" stroke="url(#ring)" stroke-width="110" stroke-linecap="round"/>
    <path d="M512 347 L512 512 L573 617.7" fill="none" stroke="#FFF1D8" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="664.5" cy="776.1" r="86" fill="#FF8A35"/>
  </g>
  <text x="525" y="231" fill="#FFF1D8" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">DoneAt</text>
  <text x="528" y="283" fill="#F4DCCB" font-family="Arial, Helvetica, sans-serif" font-size="27">Know when your time is yours</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Off Work Countdown app icon</title>
  <desc id="desc">A clock reading five o'clock, its ring broken open at the end of the day, with a warm dot that has left through the break.</desc>
  <defs>
    <linearGradient id="evening" x1="176" y1="112" x2="864" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B2048"/>
      <stop offset="1" stop-color="#1D1329"/>
    </linearGradient>
    <linearGradient id="ring" x1="220" y1="220" x2="804" y2="804" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A45"/>
      <stop offset="1" stop-color="#F05218"/>
    </linearGradient>
    <linearGradient id="free-time" x1="580" y1="690" x2="750" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A45"/>
      <stop offset="1" stop-color="#F05218"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed and deliberately square. Apple applies the platform mask. -->
  <rect width="1024" height="1024" fill="url(#evening)"/>
  <!-- The workday as a ring, deliberately broken where the day ends. -->
  <path d="M415 793.8 A 298 298 0 1 1 804.5 568.9"
        fill="none" stroke="url(#ring)" stroke-width="110" stroke-linecap="round"/>
  <!-- Hands at 17:00 — the clock-off time the product defaults to. -->
  <path d="M512 347 L512 512 L573 617.7"
        fill="none" stroke="#FFF1D8" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The detached endpoint is personal time, already past the boundary. -->
  <circle cx="664.5" cy="776.1" r="86" fill="url(#free-time)"/>
</svg>

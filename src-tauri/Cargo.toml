[package]
name = "off-work-countdown"
version = "3.1.5"
description = "Off Work Countdown desktop app"
authors = ["ififi2017"]
license = "MIT"
repository = "https://github.com/ififi2017/Off-Work-Countdown"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "off_work_countdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 自更新按渠道开关，见 docs/PLAN-MSSTORE.md 决策 2。
#
# ⚠️ 方向不能反：默认**开启**，商店构建用 `--no-default-features` 关掉。
# 反过来做（默认关、GitHub 构建显式开）会让本地 `npm run tauri:dev` 静默丢失
# 更新器——那个功能开发期几乎不会被主动测试，问题会一路漏到发版。
[features]
default = ["self-update", "run-key-autostart"]
self-update = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

# 自启动实现按渠道二选一，见 docs/PLAN-MSSTORE.md 决策 3。
#
# 与 self-update 同进同出，是为了让商店构建只需要一个 `--no-default-features`
# 就切换全部渠道差异；单独再加一个 `--features` 参数迟早会漏掉一个，而漏掉的
# 后果是一个"能装能跑、只有自启动悄悄失效"的包。
#
# ⚠️ 方向同样不能反：注册表 Run 键那条路是**默认**的，MSIX 那条是关掉默认后
# 才生效的，理由与 self-update 一致。
run-key-autostart = ["dep:tauri-plugin-autostart"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api：迷你窗需要透明窗口才能有圆角，见 lib.rs 的 setup_mini_window。
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2.4.4"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-autostart = { version = "2.5.1", optional = true }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
# 第二次启动时聚焦已有窗口，而不是再开一个进程
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }

# MSIX 的 windows.startupTask 只能用 WinRT 读写，注册表那条路在容器里是死的
# （见决策 3 与 P2 的实测记录）。版本跟着 tauri 已经引入的 0.61 走，避免同一个
# crate 编译两份。非 Windows 平台不需要，因此挂在 windows target 下。
[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.61", features = [
  "ApplicationModel",
  # 缺 WebView2 时要在窗口创建之前弹一个原生对话框，见 ensure_webview2_runtime。
  "Win32_UI_WindowsAndMessaging",
] }

[package]
name = "off-work-countdown"
version = "3.1.3"
description = "Off Work Countdown desktop app"
authors = ["ififi2017"]
license = "MIT"
repository = "https://github.com/ififi2017/Off-Work-Countdown"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "off_work_countdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api：迷你窗需要透明窗口才能有圆角，见 lib.rs 的 setup_mini_window。
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2.4.4"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
# 第二次启动时聚焦已有窗口，而不是再开一个进程
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

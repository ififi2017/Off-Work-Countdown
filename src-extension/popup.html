<!doctype html>
<html lang="en" class="extension-shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DoneAt</title>
    <link rel="stylesheet" href="bootstrap.css" />
    <script defer src="bootstrap.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-busy="true">
        <div class="boot-header" aria-hidden="true">
          <div class="boot-brand">
            <div class="boot-bone boot-title"></div>
            <div class="boot-bone boot-caption"></div>
          </div>
          <div class="boot-bone boot-icon"></div>
          <div class="boot-bone boot-icon"></div>
        </div>
        <div id="boot-status">
          <div class="boot-content" aria-hidden="true">
            <div class="boot-pair">
              <div class="boot-bone boot-field"></div>
              <div class="boot-bone boot-field"></div>
            </div>
            <div class="boot-bone boot-days"></div>
            <div class="boot-pair">
              <div class="boot-bone boot-tool"></div>
              <div class="boot-bone boot-tool"></div>
            </div>
            <div class="boot-summary">
              <div class="boot-bone boot-caption"></div>
              <div class="boot-bone boot-row"></div>
              <div class="boot-bone boot-row"></div>
            </div>
          </div>
        </div>
        <button id="boot-retry" type="button" hidden></button>
        <div class="boot-bone boot-footer" aria-hidden="true"></div>
      </div>
    </div>
  </body>
</html>

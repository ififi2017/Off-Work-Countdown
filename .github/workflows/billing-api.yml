name: Billing API

on:
  pull_request:
    paths: ['services/billing-api/**', '.github/workflows/billing-api.yml']
  push:
    branches: [main]
    paths: ['services/billing-api/**', '.github/workflows/billing-api.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/billing-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/billing-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'

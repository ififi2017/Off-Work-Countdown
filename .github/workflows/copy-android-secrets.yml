# One-off: copy the Android release secrets to the private DoneAt-App
# repository, where native releases live from 4.0. Values go straight from
# this runner's environment into `gh secret set` on stdin and are never
# printed. Delete this workflow once it has run.
name: Copy Android secrets to DoneAt-App

on:
  workflow_dispatch:

permissions: {}

env:
  TARGET: ififi2017/DoneAt-App

jobs:
  repository:
    name: Repository secrets
    runs-on: ubuntu-latest
    steps:
      - name: Copy Play signing, Play API and Lark secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DONEAT_APP_SECRETS_TOKEN }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SIGN_SECRET: ${{ secrets.LARK_SIGN_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "DONEAT_APP_SECRETS_TOKEN is not set" >&2; exit 1; }
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD \
                      ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD \
                      PLAY_SERVICE_ACCOUNT_JSON LARK_WEBHOOK LARK_SIGN_SECRET; do
            test -n "${!name}" || { echo "$name is empty here" >&2; exit 1; }
            printf '%s' "${!name}" | gh secret set "$name" --repo "$TARGET" >/dev/null
            echo "copied $name"
          done

  cn-environment:
    name: android-cn-release environment secrets
    runs-on: ubuntu-latest
    # Runs on main only and waits for the environment's reviewer approval.
    environment: android-cn-release
    steps:
      - name: Copy CN signing secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DONEAT_APP_SECRETS_TOKEN }}
          ANDROID_CN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_CN_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_CN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_CN_UPLOAD_STORE_PASSWORD }}
          ANDROID_CN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_CN_UPLOAD_KEY_ALIAS }}
          ANDROID_CN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_CN_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "DONEAT_APP_SECRETS_TOKEN is not set" >&2; exit 1; }
          for name in ANDROID_CN_UPLOAD_KEYSTORE_BASE64 ANDROID_CN_UPLOAD_STORE_PASSWORD \
                      ANDROID_CN_UPLOAD_KEY_ALIAS ANDROID_CN_UPLOAD_KEY_PASSWORD; do
            test -n "${!name}" || { echo "$name is empty here" >&2; exit 1; }
            printf '%s' "${!name}" | gh secret set "$name" --repo "$TARGET" --env android-cn-release >/dev/null
            echo "copied $name"
          done

name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json
            rustTargets: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --config src-tauri/tauri.release.conf.json
            rustTargets: x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            args: --config src-tauri/tauri.release.conf.json
            rustTargets: x86_64-pc-windows-msvc
          - name: Windows ARM64
            platform: windows-11-arm
            args: --target aarch64-pc-windows-msvc --config src-tauri/tauri.release.conf.json
            rustTargets: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check product and tag versions
        run: npm run check:version

      - name: Build signed bundles and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: Off Work Countdown __VERSION__
          releaseBody: |
            Off Work Countdown desktop release.

            See README for installation notes on unsigned macOS and Windows builds.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # 直连 GitHub 下载安装包在部分地区很慢。客户端在直连失败后会改读这份
  # latest-cn.json，它与 latest.json 内容相同，只是安装包地址带了反代前缀。
  # 必须等四个平台都跑完：latest.json 是由各个矩阵任务逐个合并上来的，
  # 提前读会拿到只含部分平台的半成品。
  mirror-manifest:
    name: Mirror updater manifest
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./package.json').version")
            echo "name=desktop-v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload latest-cn.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json --output latest.json --clobber
          node scripts/mirror-manifest.mjs latest.json latest-cn.json
          gh release upload "$TAG" latest-cn.json --clobber

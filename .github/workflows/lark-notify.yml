name: Lark Notify

# 仓库是 public，**fork 的 PR 拿不到 secrets**——直接在 CI 里发通知会让每个外部
# 贡献者的 PR 挂一个红叉。workflow_run 跑在基仓库上下文里，有 secrets，因此监听
# 「某个工作流跑完了」而不是「有人推了代码」。
on:
  workflow_run:
    workflows: ["CI", "Desktop Release", "Microsoft Store Release"]
    types: [completed]
  issues:
    types: [opened]
  pull_request_target:
    types: [closed]
  # 手动自检：改过 secrets、换过机器人之后不必等真事件，跑一次就知道通不通。
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# ⚠️ 事件里的外部内容（issue / PR 标题、提交信息）**必须**先经 env 传入，再在
# shell 里用 "$VAR" 引用。`${{ }}` 是由 runner 在 shell 看到脚本**之前**做文本替换的，
# 直接内联等于把攻击者可控的字符串拼进脚本：一个带引号的 PR 标题就能逃逸 jq 的
# --arg 执行任意命令。而这些步骤的 env 里带着飞书密钥，pull_request_target 又运行在
# 基仓库上下文中——fork 提交者据此即可窃取 secrets。

jobs:
  notify:
    runs-on: ubuntu-latest
    # 通知永远不该让别的东西失败，也不该因为自己失败而变红。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # CI 只在**失败**和**由失败转成功**时发。每次成功都发会迅速变成噪音，
      # 而噪音化的通知等于没有通知。
      - name: Resolve CI transition
        if: github.event_name == 'workflow_run'
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # 上一次同分支同工作流的结论，用来判断是不是「刚刚恢复」。
          previous=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs?branch=$BRANCH&per_page=2&status=completed" \
            --jq '[.workflow_runs[] | select(.id != '"$RUN_ID"')][0].conclusion // "none"')
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [ "$CONCLUSION" = "failure" ]; then
            echo "kind=ci-failure" >> "$GITHUB_OUTPUT"
          elif [ "$CONCLUSION" = "success" ] && [ "$previous" = "failure" ]; then
            echo "kind=ci-recovered" >> "$GITHUB_OUTPUT"
          else
            echo "kind=" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify CI result
        if: github.event_name == 'workflow_run' && steps.ci.outputs.kind != ''
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SIGN_SECRET: ${{ secrets.LARK_SIGN_SECRET }}
          KIND: ${{ steps.ci.outputs.kind }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          node scripts/lark-notify.mjs "$KIND" "$(jq -nc \
            --arg repo "$REPO" \
            --arg workflow "$WORKFLOW" \
            --arg branch "$BRANCH" \
            --arg commitMessage "$COMMIT_MESSAGE" \
            --arg runUrl "$RUN_URL" \
            '$ARGS.named')"

      - name: Send a test notification
        if: github.event_name == 'workflow_dispatch'
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SIGN_SECRET: ${{ secrets.LARK_SIGN_SECRET }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/lark-notify.mjs ci-recovered "$(jq -nc \
            --arg repo "$REPO" \
            --arg workflow "Lark Notify（手动自检）" \
            --arg branch "$BRANCH" \
            --arg runUrl "$RUN_URL" \
            '$ARGS.named')"

      - name: Notify new issue
        if: github.event_name == 'issues'
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SIGN_SECRET: ${{ secrets.LARK_SIGN_SECRET }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          SUBJECT: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login }}
          URL: ${{ github.event.issue.html_url }}
        run: |
          node scripts/lark-notify.mjs issue-opened "$(jq -nc \
            --arg repo "$REPO" \
            --arg number "$NUMBER" \
            --arg subject "$SUBJECT" \
            --arg author "$AUTHOR" \
            --arg url "$URL" \
            '$ARGS.named')"

      # 只发已合并的，关闭但未合并的不发。
      - name: Notify merged pull request
        if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SIGN_SECRET: ${{ secrets.LARK_SIGN_SECRET }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SUBJECT: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          node scripts/lark-notify.mjs pr-merged "$(jq -nc \
            --arg repo "$REPO" \
            --arg number "$NUMBER" \
            --arg subject "$SUBJECT" \
            --arg url "$URL" \
            '$ARGS.named')"

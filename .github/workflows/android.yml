name: Android

on:
  push:
    branches: [main, dev]
    paths:
      - 'src-mobile/android/**'
      - 'src-mobile/ios/Shared/**'
      - 'docs/android/synthetic-archives/**'
      - 'src-mobile/ios/App/App/Localizable.xcstrings'
      - 'scripts/generate-android-strings*'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src-mobile/android/**'
      - 'src-mobile/ios/Shared/**'
      - 'docs/android/synthetic-archives/**'
      - 'src-mobile/ios/App/App/Localizable.xcstrings'
      - 'scripts/generate-android-strings*'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The iOS catalog is the source of the Android copy; a catalog edit must be regenerated.
      - name: Generated strings are current
        working-directory: .
        run: node scripts/generate-android-strings.mjs --check
      - name: Unit tests, lint and builds
        run: ./gradlew :core:domain:test :core:data:test :core:designsystem:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain
      - name: Reject pre-release Compose/Material3 in release
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath -q > deps.txt
          if grep -E 'androidx\.compose[^ ]*:[0-9.]+-(alpha|beta|rc)' deps.txt; then
            echo "D-12: release must use stable Compose/Material3" >&2
            exit 1
          fi
